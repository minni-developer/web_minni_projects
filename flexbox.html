<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            display: flex;
            width: 100%;
            height: 500px;
            border:2px black;
            flex-wrap:wrap;
            flex-direction:row;
            align-content:space-between;
        }
        .flex-item{
            width: 75px;
            height: 75px;
            background-color: lightgray;
            border:2px solid navy ;
            text-align: center;
            font-size: 2em;
            color: whitesmoke;
            font-weight: bold;
            line-height: 1.4;
        }
        #flex-item-1{
            background-color: violet;
            order: 4;
        }
        #flex-item-2{
            background-color:aquamarine;
            order: 3;
        }
        #flex-item-3{
            background-color:rgb(180, 43, 71);
        }
        #flex-item-4{
            background-color:darkmagenta;
            order: 2;
        }
        #flex-item-5{
            background-color:deeppink;
            flex-basis: 150px;
            align-self: center;
       
        }
    
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item" id="flex-item-1">1</div>
        <div class="flex-item" id="flex-item-2">2</div>
        <div class="flex-item" id="flex-item-3">3</div>
        <div class="flex-item" id="flex-item-4">4</div>
        <div class="flex-item" id="flex-item-5">5</div>
    </div>
</body>
</html>
