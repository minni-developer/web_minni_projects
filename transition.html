<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .circle{
            width: 100px;
            height: 100px;
            background: crimson;
            transition: width 1s ,border-radius 2s,background 3s;
        }
     .circle:hover{
        width: 300px;
        border-radius: 50%;
        background: cyan;

     }   
    </style>
    <title>transition</title>
</head>
<body>
    <div class="circle"> </div>
    
</body>

</html>
